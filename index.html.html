<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>神殿家族歴史ダッシュボード</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --ink:#16213C;
  --ink-2:#2C3A5C;
  --paper:#E7EBF1;
  --surface:#FFFFFF;
  --brass:#A9762B;
  --brass-soft:#F0E2C8;
  --celadon:#3F7A64;
  --celadon-soft:#DCEAE3;
  --muted:#6E7791;
  --line:#D3DAE4;
  --line-soft:#E8ECF2;
  --shadow:0 1px 2px rgba(22,33,60,.06), 0 8px 24px rgba(22,33,60,.06);
  --radius:10px;
  --display:"Zen Old Mincho","Yu Mincho","Hiragino Mincho ProN",serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--body);
  font-size:14px;
  line-height:1.6;
  font-feature-settings:"palt" 1;
  -webkit-font-smoothing:antialiased;
}
.num{font-variant-numeric:tabular-nums;letter-spacing:.01em;}

/* ── header ── */
header{
  padding:26px 28px 20px;
  border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,#FFFFFF 0%,#F6F8FB 100%);
}
.head-inner{max-width:1560px;margin:0 auto;display:flex;align-items:flex-end;gap:24px;flex-wrap:wrap;}
.brand{flex:1 1 340px;min-width:0;}
.eyebrow{
  font-size:11px;letter-spacing:.24em;color:var(--brass);
  font-weight:700;margin:0 0 6px;
}
h1{
  font-family:var(--display);font-weight:700;font-size:30px;
  margin:0;letter-spacing:.04em;line-height:1.25;
}
.subtitle{margin:6px 0 0;color:var(--muted);font-size:13px;}
.head-actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.today{
  font-family:var(--display);font-size:15px;color:var(--ink-2);
  border-left:2px solid var(--brass);padding-left:12px;
}
.today small{display:block;font-family:var(--body);font-size:11px;color:var(--muted);letter-spacing:.1em;}
.btn{
  font-family:var(--body);font-size:13px;font-weight:500;
  border:1px solid var(--ink);background:var(--surface);color:var(--ink);
  padding:9px 16px;border-radius:6px;cursor:pointer;transition:background .15s,color .15s;
}
.btn:hover{background:var(--ink);color:#fff;}
.btn:focus-visible{outline:2px solid var(--brass);outline-offset:2px;}
.btn.primary{background:var(--ink);color:#fff;}
.btn.primary:hover{background:var(--ink-2);}
.btn[disabled]{opacity:.5;cursor:default;}
.load-note{font-size:11px;color:var(--muted);max-width:230px;line-height:1.5;}
.banner{
  max-width:1560px;margin:16px auto -4px;padding:11px 16px;border-radius:7px;
  font-size:12.5px;line-height:1.6;
  background:#FCF3E4;border:1px solid #E6CFA4;color:#6B4C14;
}
.banner b{font-weight:700;}

/* ── grid ── */
main{
  max-width:1560px;margin:0 auto;padding:22px 28px 48px;
  display:grid;gap:22px;
  grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);
  align-items:start;
}
.panel{
  background:var(--surface);border:1px solid var(--line);
  border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;
}
.panel-head{
  display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;
  padding:16px 20px 12px;border-bottom:1px solid var(--line-soft);
}
.panel-head h2{
  font-family:var(--display);font-size:17px;font-weight:700;
  margin:0;letter-spacing:.05em;
}
.panel-head .count{
  font-size:11px;color:var(--muted);letter-spacing:.1em;margin-left:auto;
}
.panel-body{padding:18px 20px 20px;}
.panel-foot{
  padding:0 20px 14px;display:flex;justify-content:flex-end;
}
.detail-link{
  font-size:12px;color:var(--muted);text-decoration:none;
  display:inline-flex;align-items:center;gap:5px;
  border-bottom:1px solid transparent;padding-bottom:1px;
}
.detail-link:hover{color:var(--brass);border-bottom-color:var(--brass);}
.detail-link:focus-visible{outline:2px solid var(--brass);outline-offset:3px;}
.detail-link .arrow{font-size:11px;color:var(--brass);}

/* ── 1. 進捗 ── */
.stats{display:flex;gap:0;border:1px solid var(--line-soft);border-radius:8px;overflow:hidden;margin-bottom:20px;}
.stat{flex:1;padding:12px 16px;border-right:1px solid var(--line-soft);}
.stat:last-child{border-right:none;}
.stat .v{font-family:var(--display);font-size:26px;line-height:1.1;}
.stat .v em{font-style:normal;font-size:14px;color:var(--muted);margin-left:2px;}
.stat .k{font-size:11px;color:var(--muted);letter-spacing:.08em;margin-top:2px;}

.rail-legend{
  display:flex;gap:18px;align-items:center;font-size:11px;color:var(--muted);
  margin:0 0 14px;padding-left:2px;flex-wrap:wrap;
}
.rail-legend span{display:flex;align-items:center;gap:6px;}
.chip-dot{width:10px;height:10px;border-radius:50%;display:inline-block;}
.chip-dot.done{background:var(--brass);}
.chip-dot.next{background:#fff;border:2px solid var(--brass);}
.chip-dot.todo{background:#fff;border:1px solid var(--line);}

.person{
  display:grid;grid-template-columns:minmax(130px,1.1fr) minmax(220px,2fr) auto;
  gap:16px;align-items:center;
  padding:12px 4px;border-bottom:1px solid var(--line-soft);
}
.person:last-child{border-bottom:none;}
.person .name{font-weight:500;font-size:14px;}
.person .name small{display:block;color:var(--muted);font-size:11px;font-weight:400;}
.track{display:flex;align-items:center;gap:0;}
.node{
  width:22px;height:22px;border-radius:50%;flex:none;
  display:flex;align-items:center;justify-content:center;
  font-size:10px;font-weight:700;position:relative;
  background:#fff;border:1px solid var(--line);color:var(--muted);
  font-variant-numeric:tabular-nums;
}
.node.done{background:var(--brass);border-color:var(--brass);color:#fff;}
.node.next{border:2px solid var(--brass);color:var(--brass);box-shadow:0 0 0 3px var(--brass-soft);}
.link{flex:1;height:1px;background:var(--line);min-width:6px;}
.link.done{background:var(--brass);height:2px;}
.person .status{text-align:right;white-space:nowrap;}
.person .status .frac{font-family:var(--display);font-size:16px;}
.person .status .frac em{font-style:normal;font-size:11px;color:var(--muted);}
.person .status .next{font-size:11px;color:var(--brass);font-weight:500;}
.person .status .next.finished{color:var(--celadon);}

/* ── 2. レッスン ── */
.lesson{
  display:grid;grid-template-columns:56px 1fr;gap:14px;
  padding:13px 0;border-bottom:1px solid var(--line-soft);
}
.lesson:last-child{border-bottom:none;}
.datebox{text-align:center;padding-top:2px;}
.datebox .md{font-family:var(--display);font-size:17px;line-height:1.1;}
.datebox .dow{font-size:10px;color:var(--muted);letter-spacing:.08em;}
.datebox .when{
  display:inline-block;margin-top:5px;font-size:10px;padding:1px 6px;border-radius:99px;
  background:var(--paper);color:var(--muted);white-space:nowrap;
}
.datebox .when.soon{background:var(--brass);color:#fff;}
.lesson .who{font-weight:500;font-size:14px;}
.lesson .ord{
  display:inline-block;font-size:10.5px;font-weight:700;color:var(--brass);
  border:1px solid var(--brass-soft);background:#FCF7EE;
  border-radius:4px;padding:1px 6px;margin-right:7px;vertical-align:1px;
}
.lesson .meta{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.65;}
.lesson .meta b{font-weight:500;color:var(--ink-2);}
.empty{color:var(--muted);font-size:13px;padding:22px 0;text-align:center;}

/* ── 3. 調整集会 ── */
.next-meeting{
  border:1px solid var(--brass-soft);background:#FCF9F3;
  border-radius:8px;padding:16px 18px;margin-bottom:16px;
  display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center;
}
.next-meeting .big{font-family:var(--display);font-size:24px;line-height:1.2;white-space:nowrap;}
.next-meeting .big small{display:block;font-family:var(--body);font-size:11px;color:var(--brass);letter-spacing:.12em;font-weight:700;margin-bottom:4px;}
.next-meeting .agenda{font-size:13px;}
.next-meeting .agenda .m{font-size:11.5px;color:var(--muted);margin-top:4px;}
table.meetings{width:100%;border-collapse:collapse;font-size:12.5px;}
table.meetings th{
  text-align:left;font-weight:500;font-size:10.5px;letter-spacing:.1em;color:var(--muted);
  border-bottom:1px solid var(--line);padding:0 8px 6px 0;
}
table.meetings td{padding:9px 8px 9px 0;border-bottom:1px solid var(--line-soft);vertical-align:top;}
table.meetings td.d{white-space:nowrap;font-variant-numeric:tabular-nums;}
table.meetings tr:last-child td{border-bottom:none;}

/* ── 4. リンク ── */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:-4px 0 14px;flex-wrap:wrap;}
.tab{
  font-family:var(--body);font-size:12.5px;border:none;background:none;cursor:pointer;
  padding:8px 12px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;
}
.tab:hover{color:var(--ink);}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--brass);font-weight:500;}
.tab:focus-visible{outline:2px solid var(--brass);outline-offset:-2px;}
.linkrow{display:block;text-decoration:none;color:inherit;padding:10px 0;border-bottom:1px solid var(--line-soft);}
.linkrow:last-child{border-bottom:none;}
.linkrow .t{font-size:13px;font-weight:500;display:flex;align-items:center;gap:6px;}
.linkrow[href]:hover .t{color:var(--brass);text-decoration:underline;}
.linkrow .t .arrow{font-size:11px;color:var(--brass);}
.linkrow .d{font-size:11.5px;color:var(--muted);margin-top:2px;}
.linkrow.nolink .t{color:var(--muted);}
.linkrow.nolink .d::after{content:" — URL未設定";color:var(--brass);}

footer{
  max-width:1560px;margin:0 auto;padding:0 28px 40px;
  font-size:11px;color:var(--muted);line-height:1.8;
}

@media (max-width:1080px){
  main{grid-template-columns:minmax(0,1fr);}
  .stats{flex-wrap:wrap;}
  .stat{flex:1 1 40%;border-bottom:1px solid var(--line-soft);}
}
@media (max-width:620px){
  header{padding:20px 16px 16px;}
  main{padding:16px 16px 32px;}
  h1{font-size:23px;}
  .person{grid-template-columns:1fr;gap:8px;}
  .person .status{text-align:left;}
  .next-meeting{grid-template-columns:1fr;gap:10px;}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;}}
</style>
</head>
<body>

<header>
  <div class="head-inner">
    <div class="brand">
      <p class="eyebrow">神殿家族歴史</p>
      <h1>神殿家族歴史ダッシュボード</h1>
      <p class="subtitle">神殿準備セミナーの進捗、今後のレッスン、調整集会、共有資料を1枚にまとめています。</p>
    </div>
    <div class="head-actions">
      <div class="today num" id="today"><small>本日</small>—</div>
      <div>
        <button class="btn primary" id="refreshBtn">最新データに更新</button>
        <button class="btn" id="loadBtn">ファイルから読み込む</button>
        <input type="file" id="fileInput" accept=".xlsx,.xlsm,.xls" hidden>
      </div>
      <p class="load-note" id="loadStatus">スプレッドシートを読み込んでいます…</p>
    </div>
  </div>
  <div class="banner" id="banner" hidden></div>
</header>

<main>

  <!-- ① 神殿準備セミナー 進捗 -->
  <section class="panel" id="panel-progress" style="grid-column:1;grid-row:1;">
    <div class="panel-head">
      <h2>神殿準備セミナー 対象者と進捗状況</h2>
      <span class="count" id="progressCount"></span>
    </div>
    <div class="panel-body">
      <div class="stats" id="stats"></div>
      <div class="rail-legend">
        <span><i class="chip-dot done"></i>受講済み</span>
        <span><i class="chip-dot next"></i>次のレッスン</span>
        <span><i class="chip-dot todo"></i>未受講</span>
      </div>
      <div id="people"></div>
    </div>
    <div class="panel-foot">
      <a class="detail-link" id="link-progress" target="_blank" rel="noopener">詳細を見る<span class="arrow">↗</span></a>
    </div>
  </section>

  <!-- ② 2週間以内のレッスン -->
  <section class="panel" id="panel-lessons" style="grid-column:2;grid-row:1;">
    <div class="panel-head">
      <h2>今後2週間のレッスン</h2>
      <span class="count" id="lessonCount"></span>
    </div>
    <div class="panel-body" id="lessons"></div>
    <div class="panel-foot">
      <a class="detail-link" id="link-lessons" target="_blank" rel="noopener">詳細を見る<span class="arrow">↗</span></a>
    </div>
  </section>

  <!-- ③ 調整集会 -->
  <section class="panel" id="panel-council" style="grid-column:1;grid-row:2;">
    <div class="panel-head">
      <h2>神殿家族歴史調整集会</h2>
      <span class="count" id="meetingCount"></span>
    </div>
    <div class="panel-body" id="meetings"></div>
    <div class="panel-foot">
      <a class="detail-link" id="link-meetings" target="_blank" rel="noopener">詳細を見る<span class="arrow">↗</span></a>
    </div>
  </section>

  <!-- ④ 共有書類＆リンク -->
  <section class="panel" id="panel-links" style="grid-column:2;grid-row:2;">
    <div class="panel-head">
      <h2>共有書類＆リンク</h2>
    </div>
    <div class="panel-body">
      <div class="tabs" id="tabs" role="tablist"></div>
      <div id="links"></div>
    </div>
    <div class="panel-foot">
      <a class="detail-link" id="link-docs" target="_blank" rel="noopener">詳細を見る<span class="arrow">↗</span></a>
    </div>
  </section>

</main>

<footer id="footer"></footer>

<script>
/* ==========================================================
   データ　── エクセルを読み込まない場合はここが表示されます。
   直接編集しても構いません。
   ========================================================== */

/* 公開スプレッドシートのURL。別のシートに差し替えるときはここを書き換えます。
   Googleスプレッドシート →「ファイル」→「共有」→「ウェブに公開」→ ドキュメント全体 → ウェブページ */
const SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRui2PeF94gVhnDAzHNSgM6JAIQGrsLbUZWO7TJjn82ZlUTOVRKJyNbayQZcLmtKW3-BCaoy0n7QQ0f/pubhtml";

/* 各パネルの「詳細を見る」が開く先。
   既定では上のスプレッドシート全体を開きます。
   シートごとに直接開きたいときは、スプレッドシートで各タブを選び、
   アドレスバー末尾の「#gid=数字」をコピーして、下のように書き足してください。
     進捗: SHEET_URL + "#gid=1234567890"
   スプレッドシートを読み込めた場合は、この対応付けを自動で作ります。 */
const SOURCE_LINKS = {
  進捗:         SHEET_URL,
  レッスン予定: SHEET_URL,
  調整集会:     SHEET_URL,
  共有リンク:   SHEET_URL
};

/* シートID（gid）。ここを埋めると、より確実なCSV形式で読み込みます。
   調べ方：スプレッドシートを開いて各タブをクリックし、
   アドレスバー末尾の「#gid=1234567890」の数字部分をコピーして貼り付けます。
   空のままでも、公開ページからの読み込みを試みます。 */
const SHEET_GIDS = {
  進捗:         "",
  レッスン予定: "",
  調整集会:     "",
  共有リンク:   ""
};

/* ==========================================================
   予備データ　── スプレッドシートを読み込めなかったときだけ表示されます。
   このファイルは公開される場所に置かれるため、氏名はイニシャルにしてあります。
   実名はスプレッドシートを読み込んだ時点で表示に切り替わります。
   ========================================================== */
const DATA = {
  source: "予備データ（イニシャル表示）",
  totalLessons: 7,
  people: [
    { name:"K 姉妹",   group:"姉妹", done:[1,1,1,1,1,1,0], note:"" },
    { name:"B.E. 姉妹", group:"姉妹", done:[1,0,0,0,0,0,0], note:"" },
    { name:"M 姉妹",   group:"姉妹", done:[1,1,1,1,1,0,0], note:"" },
    { name:"M.K. 兄弟", group:"兄弟", done:[0,0,0,0,0,0,0], note:"これから開始" },
    { name:"H.R. 兄弟", group:"兄弟", done:[1,1,1,0,0,0,0], note:"" },
    { name:"L.C. 兄弟", group:"兄弟", done:[0,0,0,0,0,0,0], note:"これから開始" }
  ],
  lessons: [
    { n:7, date:"2026-09-01", time:"19:30", who:"K 姉妹",    teacher:"Y 兄弟", place:"教会 2階 教室B", note:"最終レッスン" },
    { n:2, date:"2026-09-02", time:"20:00", who:"B.E. 姉妹", teacher:"S 姉妹", place:"オンライン（Zoom）", note:"" },
    { n:6, date:"2026-09-05", time:"19:00", who:"M 姉妹",    teacher:"S 姉妹", place:"教会 2階 教室A", note:"" },
    { n:4, date:"2026-09-06", time:"13:00", who:"H.R. 兄弟", teacher:"Y 兄弟", place:"教会 1階 集会室", note:"聖餐会後" },
    { n:1, date:"2026-09-08", time:"19:30", who:"M.K. 兄弟", teacher:"T 兄弟", place:"教会 2階 教室B", note:"初回" },
    { n:1, date:"2026-09-10", time:"20:00", who:"L.C. 兄弟", teacher:"T 兄弟", place:"オンライン（Zoom）", note:"初回" },
    { n:3, date:"2026-09-12", time:"19:00", who:"B.E. 姉妹", teacher:"S 姉妹", place:"教会 2階 教室A", note:"" },
    { n:5, date:"2026-09-19", time:"19:00", who:"H.R. 兄弟", teacher:"Y 兄弟", place:"教会 2階 教室A", note:"" }
  ],
  meetings: [
    { date:"2026-09-06", time:"11:00", place:"教会 高等評議会室", chair:"監督会 第一顧問", agenda:"対象者の進捗確認／9月の神殿参入予定", note:"" },
    { date:"2026-10-04", time:"11:00", place:"教会 高等評議会室", chair:"監督会 第一顧問", agenda:"秋の神殿旅行の計画", note:"" },
    { date:"2026-11-01", time:"11:00", place:"教会 高等評議会室", chair:"監督会 第一顧問", agenda:"家族歴史の名前提出状況", note:"" },
    { date:"2026-12-06", time:"11:00", place:"教会 高等評議会室", chair:"監督会 第一顧問", agenda:"年間の振り返りと次年度の目標", note:"" }
  ],
  links: [
    { cat:"手引き",   name:"神殿準備セミナー 手引き", url:"https://www.churchofjesuschrist.org/study/manual/temple-preparation-seminar-teachers-manual?lang=jpn", desc:"レッスン1〜7の教師用手引き" },
    { cat:"手引き",   name:"総合手引き 第25章「神殿の教義とワークの調整」", url:"https://www.churchofjesuschrist.org/study/manual/general-handbook?lang=jpn", desc:"調整集会の運営に関する箇所" },
    { cat:"書類",     name:"対象者進捗シート", url:"", desc:"共有ドライブのURLを入れてください" },
    { cat:"書類",     name:"調整集会 議事録フォルダ", url:"", desc:"共有ドライブのURLを入れてください" },
    { cat:"家族歴史", name:"FamilySearch", url:"https://www.familysearch.org/", desc:"名前の提出・家系図の作成" },
    { cat:"家族歴史", name:"神殿の名前カード提出", url:"https://www.familysearch.org/temple/", desc:"予約済みの名前の確認" },
    { cat:"動画",     name:"神殿の祝福について（動画集）", url:"https://www.churchofjesuschrist.org/media/collection/temples-videos?lang=jpn", desc:"レッスンで使える短い動画" }
  ]
};

/* ========================= 表示 ========================= */
const DOW = ["日","月","火","水","木","金","土"];
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const parseDate = s => { const [y,m,d] = String(s).split("-").map(Number); return new Date(y, m-1, d); };
const startOfDay = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());

function render(){
  const today = startOfDay(new Date());
  document.getElementById("today").innerHTML =
    `<small>本日</small>${today.getFullYear()}年${today.getMonth()+1}月${today.getDate()}日（${DOW[today.getDay()]}）`;

  renderProgress();
  renderLessons(today);
  renderMeetings(today);
  renderLinks();
  renderDetailLinks();

  document.getElementById("footer").innerHTML =
    `データの取得元：${esc(DATA.source)}<br>` +
    `スプレッドシートを読み込めない場合は、このファイルに保存されているイニシャル表示の予備データを出しています。`;
}

/* 各パネル右下「詳細を見る」の行き先を設定 */
function renderDetailLinks(){
  const map = {
    "link-progress":"進捗", "link-lessons":"レッスン予定",
    "link-meetings":"調整集会", "link-docs":"共有リンク"
  };
  Object.entries(map).forEach(([id, sheet]) => {
    const a = document.getElementById(id);
    if(!a) return;
    const url = SOURCE_LINKS[sheet] || SHEET_URL;
    a.href = url;
    a.title = `元データ「${sheet}」シートを開きます`;
    a.firstChild.textContent = "詳細を見る";
  });
}

/* ① 進捗 */
function renderProgress(){
  const N = DATA.totalLessons;
  const ppl = DATA.people.filter(p => p.name);
  const doneTotal = ppl.reduce((s,p) => s + p.done.filter(Boolean).length, 0);
  const finished  = ppl.filter(p => p.done.filter(Boolean).length >= N).length;
  const notStarted = ppl.filter(p => p.done.filter(Boolean).length === 0).length;

  document.getElementById("progressCount").textContent = `全${N}回のレッスン`;

  document.getElementById("stats").innerHTML = `
    <div class="stat"><div class="v num">${ppl.length}<em>名</em></div><div class="k">対象者</div></div>
    <div class="stat"><div class="v num">${doneTotal}<em>/${ppl.length*N}</em></div><div class="k">受講済みレッスン</div></div>
    <div class="stat"><div class="v num">${Math.round(doneTotal/(ppl.length*N)*100)}<em>%</em></div><div class="k">全体の進捗</div></div>
    <div class="stat"><div class="v num">${finished}<em>名</em></div><div class="k">全レッスン修了</div></div>
    <div class="stat"><div class="v num">${notStarted}<em>名</em></div><div class="k">未開始</div></div>`;

  document.getElementById("people").innerHTML = ppl.map(p => {
    const done = p.done.slice(0, N);
    const cnt = done.filter(Boolean).length;
    const nextIdx = done.findIndex(v => !v);
    let track = "";
    for(let i=0;i<N;i++){
      const cls = done[i] ? "done" : (i === nextIdx ? "next" : "");
      track += `<div class="node ${cls}">${i+1}</div>`;
      if(i < N-1) track += `<div class="link ${done[i] && done[i+1] ? "done" : ""}"></div>`;
    }
    const status = nextIdx === -1
      ? `<div class="next finished">全レッスン修了</div>`
      : `<div class="next">次：レッスン${nextIdx+1}</div>`;
    return `<div class="person">
      <div class="name">${esc(p.name)}${p.note ? `<small>${esc(p.note)}</small>` : ""}</div>
      <div class="track">${track}</div>
      <div class="status"><div class="frac num">${cnt}<em>/${N}</em></div>${status}</div>
    </div>`;
  }).join("");
}

/* ② 2週間以内のレッスン */
function renderLessons(today){
  const limit = new Date(today); limit.setDate(limit.getDate() + 14);
  const list = DATA.lessons
    .map(l => ({...l, d: parseDate(l.date)}))
    .filter(l => l.d >= today && l.d <= limit)
    .sort((a,b) => a.d - b.d || String(a.time).localeCompare(String(b.time)));

  document.getElementById("lessonCount").textContent = `${list.length}件`;

  const el = document.getElementById("lessons");
  if(!list.length){
    el.innerHTML = `<p class="empty">今後2週間に予定されているレッスンはありません。<br>エクセルの「レッスン予定」シートに日付を追加してください。</p>`;
    return;
  }
  el.innerHTML = list.map(l => {
    const days = Math.round((l.d - today) / 86400000);
    const when = days === 0 ? "今日" : days === 1 ? "明日" : `あと${days}日`;
    return `<div class="lesson">
      <div class="datebox">
        <div class="md num">${l.d.getMonth()+1}/${l.d.getDate()}</div>
        <div class="dow">${DOW[l.d.getDay()]}</div>
        <div class="when ${days <= 3 ? "soon" : ""}">${when}</div>
      </div>
      <div>
        <div class="who"><span class="ord num">第${l.n}回</span>${esc(l.who)}</div>
        <div class="meta">
          <b>${esc(l.time)}</b>　${esc(l.place)}<br>
          指導者：<b>${esc(l.teacher)}</b>${l.note ? `　／　${esc(l.note)}` : ""}
        </div>
      </div>
    </div>`;
  }).join("");
}

/* ③ 調整集会 */
function renderMeetings(today){
  const list = DATA.meetings
    .map(m => ({...m, d: parseDate(m.date)}))
    .sort((a,b) => a.d - b.d);
  const upcoming = list.filter(m => m.d >= today);
  document.getElementById("meetingCount").textContent = `今後${upcoming.length}回`;

  const el = document.getElementById("meetings");
  if(!upcoming.length){
    el.innerHTML = `<p class="empty">今後の調整集会が登録されていません。<br>エクセルの「調整集会」シートに追加してください。</p>`;
    return;
  }
  const next = upcoming[0], rest = upcoming.slice(1);
  const days = Math.round((next.d - today) / 86400000);
  const when = days === 0 ? "本日" : days === 1 ? "明日" : `あと${days}日`;

  let html = `<div class="next-meeting">
    <div class="big num"><small>次回 ・ ${when}</small>${next.d.getMonth()+1}月${next.d.getDate()}日（${DOW[next.d.getDay()]}）${esc(next.time)}</div>
    <div class="agenda">
      ${esc(next.agenda)}
      <div class="m">${esc(next.place)}　／　司会：${esc(next.chair)}${next.note ? `　／　${esc(next.note)}` : ""}</div>
    </div>
  </div>`;

  if(rest.length){
    html += `<table class="meetings"><thead><tr>
        <th>日付</th><th>時間</th><th>議題</th><th>場所</th>
      </tr></thead><tbody>` +
      rest.map(m => `<tr>
        <td class="d">${m.d.getMonth()+1}月${m.d.getDate()}日（${DOW[m.d.getDay()]}）</td>
        <td class="d">${esc(m.time)}</td>
        <td>${esc(m.agenda)}</td>
        <td>${esc(m.place)}</td>
      </tr>`).join("") + `</tbody></table>`;
  }
  el.innerHTML = html;
}

/* ④ 共有書類＆リンク */
let activeTab = null;
function renderLinks(){
  const cats = [...new Set(DATA.links.map(l => l.cat || "その他"))];
  if(!cats.length){
    document.getElementById("tabs").innerHTML = "";
    document.getElementById("links").innerHTML = `<p class="empty">リンクが登録されていません。</p>`;
    return;
  }
  if(!cats.includes(activeTab)) activeTab = cats[0];

  document.getElementById("tabs").innerHTML = cats.map(c =>
    `<button class="tab" role="tab" aria-selected="${c === activeTab}" data-cat="${esc(c)}">${esc(c)}</button>`
  ).join("");

  document.querySelectorAll(".tab").forEach(b => b.addEventListener("click", () => {
    activeTab = b.dataset.cat; renderLinks();
  }));

  document.getElementById("links").innerHTML = DATA.links
    .filter(l => (l.cat || "その他") === activeTab)
    .map(l => {
      const has = l.url && /^https?:/i.test(l.url);
      const attrs = has ? ` href="${esc(l.url)}" target="_blank" rel="noopener"` : "";
      return `<a class="linkrow ${has ? "" : "nolink"}"${attrs}>
        <div class="t">${esc(l.name)}${has ? `<span class="arrow">↗</span>` : ""}</div>
        <div class="d">${esc(l.desc)}</div>
      </a>`;
    }).join("");
}

/* ================= エクセル読み込み ================= */
const truthy = v => v === true || [1,"1","true","TRUE","済","〇","○","◯","x","X","✓"].includes(v);

function toISO(v){
  if(v instanceof Date) return `${v.getFullYear()}-${String(v.getMonth()+1).padStart(2,"0")}-${String(v.getDate()).padStart(2,"0")}`;
  if(typeof v === "number"){ const d = XLSX.SSF.parse_date_code(v); return d ? `${d.y}-${String(d.m).padStart(2,"0")}-${String(d.d).padStart(2,"0")}` : ""; }
  const s = String(v || "").trim().replace(/\//g, "-");
  const m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  return m ? `${m[1]}-${m[2].padStart(2,"0")}-${m[3].padStart(2,"0")}` : "";
}
function toTime(v){
  if(v instanceof Date) return `${String(v.getHours()).padStart(2,"0")}:${String(v.getMinutes()).padStart(2,"0")}`;
  if(typeof v === "number"){ const t = Math.round(v*24*60); return `${String(Math.floor(t/60)%24).padStart(2,"0")}:${String(t%60).padStart(2,"0")}`; }
  return String(v || "").trim();
}
function rowsOf(wb, sheetName){
  const ws = wb.Sheets[sheetName];
  if(!ws) return [];
  const grid = XLSX.utils.sheet_to_json(ws, {header:1, raw:true, cellDates:true, defval:null});
  const hi = grid.findIndex(r => r && r.some(c => ["氏名","回","日付","カテゴリ"].includes(String(c || "").trim())));
  if(hi < 0) return [];
  const head = grid[hi].map(c => String(c || "").trim());
  return grid.slice(hi+1)
    .filter(r => r && r.some(c => c !== null && c !== "" && c !== false))
    .map(r => Object.fromEntries(head.map((h,i) => [h, r[i]])));
}

/* 4シート分の行データをダッシュボードに流し込む（エクセル・スプレッドシート共通） */
function applySheets(sheets){
  let used = [];

  const pr = sheets["進捗"] || [];
  const people = pr.filter(r => r["氏名"] && !/^[※注*]/.test(String(r["氏名"]).trim())).map(r => ({
    name: String(r["氏名"]).trim(),
    group: r["区分"] || "",
    note: r["備考"] || "",
    done: Array.from({length: DATA.totalLessons}, (_,i) => truthy(r[`レッスン${i+1}`]) ? 1 : 0)
  }));
  if(people.length){ DATA.people = people; used.push("進捗"); }

  const ls = (sheets["レッスン予定"] || []).filter(r => toISO(r["日付"])).map(r => ({
    n: r["回"] ?? "", date: toISO(r["日付"]), time: toTime(r["開始時間"]),
    who: r["対象者"] || "", teacher: r["指導者"] || "", place: r["場所"] || "",
    note: r["題名／備考"] || r["備考"] || ""
  }));
  if(ls.length){ DATA.lessons = ls; used.push("レッスン予定"); }

  const mt = (sheets["調整集会"] || []).filter(r => toISO(r["日付"])).map(r => ({
    date: toISO(r["日付"]), time: toTime(r["開始時間"]), place: r["場所"] || "",
    chair: r["司会"] || "", agenda: r["議題"] || "", note: r["備考"] || ""
  }));
  if(mt.length){ DATA.meetings = mt; used.push("調整集会"); }

  const lk = (sheets["共有リンク"] || []).filter(r => r["名称"]).map(r => ({
    cat: r["カテゴリ"] || "その他", name: r["名称"], url: r["URL"] || "", desc: r["説明"] || ""
  }));
  if(lk.length){ DATA.links = lk; used.push("共有リンク"); }

  return used;
}

/* 表（2次元配列）から見出し行を探して {列名: 値} の配列に変換 */
function gridToRows(grid){
  const hi = grid.findIndex(r => r && r.some(c => ["氏名","回","日付","カテゴリ"].includes(String(c ?? "").trim())));
  if(hi < 0) return [];
  const head = grid[hi].map(c => String(c ?? "").trim());
  return grid.slice(hi + 1)
    .filter(r => r && r.some(c => c !== null && c !== undefined && String(c).trim() !== "" && c !== false && String(c).trim().toUpperCase() !== "FALSE"))
    .map(r => Object.fromEntries(head.map((h, i) => [h, r[i]])));
}

/* 公開ページ（pubhtml）から全シートを取り出す */
function parsePubHtml(html){
  const doc = new DOMParser().parseFromString(html, "text/html");
  const sheets = {};
  const buttons = doc.querySelectorAll('[id^="sheet-button-"]');
  const grab = table => {
    if(!table) return [];
    return gridToRows([...table.querySelectorAll("tr")].map(tr =>
      [...tr.querySelectorAll("td")].map(td => td.textContent.trim())
    ));
  };
  if(buttons.length){
    buttons.forEach(b => {
      const gid = b.id.replace("sheet-button-", "");
      const name = b.textContent.trim();
      const box = doc.getElementById(gid);
      sheets[name] = grab(box && box.querySelector("table"));
      if(name in SOURCE_LINKS) SOURCE_LINKS[name] = SHEET_URL + "#gid=" + gid;
    });
  }else{
    sheets["進捗"] = grab(doc.querySelector("table"));
  }
  return sheets;
}

function setStatus(text){ document.getElementById("loadStatus").textContent = text; }
function showBanner(html){
  const b = document.getElementById("banner");
  if(!html){ b.hidden = true; return; }
  b.innerHTML = html; b.hidden = false;
}

/* CSVを2次元配列に変換（引用符つきの項目に対応） */
function parseCSV(text){
  const rows = [];
  let row = [], cell = "", q = false;
  for(let i = 0; i < text.length; i++){
    const c = text[i];
    if(q){
      if(c === '"'){ if(text[i+1] === '"'){ cell += '"'; i++; } else q = false; }
      else cell += c;
    }else if(c === '"'){ q = true; }
    else if(c === ","){ row.push(cell); cell = ""; }
    else if(c === "\n"){ row.push(cell); rows.push(row); row = []; cell = ""; }
    else if(c !== "\r"){ cell += c; }
  }
  row.push(cell); rows.push(row);
  return rows;
}

/* CSV形式で1シートずつ読み込む */
async function fetchViaCsv(){
  const base = SHEET_URL.replace(/\/pubhtml.*$/, "/pub");
  const names = Object.keys(SHEET_GIDS).filter(n => String(SHEET_GIDS[n]).trim());
  if(!names.length) throw new Error("シートID（gid）が未設定です");
  const sheets = {};
  for(const name of names){
    const gid = String(SHEET_GIDS[name]).trim();
    const url = `${base}?gid=${gid}&single=true&output=csv&cachebust=${Date.now()}`;
    const res = await fetch(url);
    if(!res.ok) throw new Error(`${name}：HTTP ${res.status}`);
    sheets[name] = gridToRows(parseCSV(await res.text()));
    SOURCE_LINKS[name] = SHEET_URL + "#gid=" + gid;
  }
  return sheets;
}

/* 公開ページ（pubhtml）から全シートをまとめて読み込む */
async function fetchViaPubHtml(){
  const url = SHEET_URL + (SHEET_URL.includes("?") ? "&" : "?") + "cachebust=" + Date.now();
  const res = await fetch(url);
  if(!res.ok) throw new Error("HTTP " + res.status);
  return parsePubHtml(await res.text());
}

/* スプレッドシートから読み込む（CSV → 公開ページ の順に試す） */
async function loadFromWeb(){
  const btn = document.getElementById("refreshBtn");
  btn.disabled = true;
  setStatus("スプレッドシートを読み込んでいます…");
  showBanner("");
  const errors = [];
  try{
    let sheets = null;
    for(const [label, fn] of [["CSV形式", fetchViaCsv], ["公開ページ", fetchViaPubHtml]]){
      try{ sheets = await fn(); break; }
      catch(e){ errors.push(`${label}：${e.message}`); }
    }
    if(!sheets) throw new Error(errors.join(" ／ "));

    const used = applySheets(sheets);
    if(!used.length) throw new Error("見出し行（氏名／回／日付／カテゴリ）が見つかりません");
    DATA.source = "Googleスプレッドシート「神殿家族歴史ダッシュボード_データ」";
    activeTab = null;
    render();
    const t = new Date();
    setStatus(`スプレッドシートから読み込みました（${String(t.getHours()).padStart(2,"0")}:${String(t.getMinutes()).padStart(2,"0")} 時点／${used.join("・")}）`);
  }catch(err){
    setStatus("スプレッドシートを直接読み込めませんでした。");
    showBanner(
      `<b>スプレッドシートの自動読み込みができませんでした。</b>　表示中の内容は、このファイルに保存されている前回のデータです。` +
      `<br>ブラウザには、パソコンに保存したHTMLファイルから外部サイトのデータを読み取らせない仕組みがあり、多くの場合これが原因です。` +
      `次のどちらかで解決します。<br>` +
      `　① このHTMLをウェブ上（Googleサイト、GitHub Pages など）に置いて、そのURLから開く。<br>` +
      `　② 「ファイルから読み込む」でエクセルを選ぶ。スプレッドシートは「ファイル」→「ダウンロード」→「Microsoft Excel」で書き出せます。<br>` +
      `各パネル右下の「詳細を見る」は、この状態でもスプレッドシートを開けます。` +
      `<br><span style="opacity:.75">詳細：${esc(err.message)}</span>`
    );
  }finally{
    btn.disabled = false;
  }
}

/* エクセルファイルから読み込む（予備の手段） */
document.getElementById("refreshBtn").addEventListener("click", loadFromWeb);
document.getElementById("loadBtn").addEventListener("click", () => document.getElementById("fileInput").click());
document.getElementById("fileInput").addEventListener("change", async e => {
  const file = e.target.files[0];
  if(!file) return;
  try{
    const wb = XLSX.read(await file.arrayBuffer(), {cellDates:true});
    const sheets = {};
    ["進捗","レッスン予定","調整集会","共有リンク"].forEach(n => { sheets[n] = rowsOf(wb, n); });
    const used = applySheets(sheets);
    if(!used.length) throw new Error("見出し行が見つかりません");
    DATA.source = file.name;
    activeTab = null;
    render();
    showBanner("");
    setStatus(`${file.name} を読み込みました（${used.join("・")}）`);
  }catch(err){
    alert("ファイルを読み込めませんでした。シート名が「進捗」「レッスン予定」「調整集会」「共有リンク」になっているか確認してください。\n\n" + err.message);
  }
  e.target.value = "";
});

render();
loadFromWeb();
</script>
